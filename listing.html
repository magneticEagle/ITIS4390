<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Makes the page scale correctly on phones -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Listing</title>
  <!-- Main stylesheet -->
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/listing.css">
</head>
<body>
  <!-- Top header -->
  <div data-component="components/header.html"></div>

  <!-- Main page content -->
  <main class="page-shell">
    <section class="main-card listing-page">
      <!-- Main form area -->
      <div class="listing-main">
        <!-- Image upload area -->
        <div class="form-block">
          <div class="placeholder-box image-box">
            <div>
              <div>Select Images</div>
              <div class="small-text">(Max: 10)</div>
            </div>
          </div>
        </div>

        <!-- Listing info -->
        <div class="form-block">
          <h1 class="section-title">Listing Information</h1>
          <input class="input" type="text" placeholder="Title">

          <!-- Price and ZIP code -->
          <div class="two-col">
            <input class="input" type="text" placeholder="Price">
            <input class="input" type="text" placeholder="ZIP Code">
          </div>
        </div>

        <!-- Category -->
        <div class="form-block">
          <div class="fake-select">
            <select class="select">
              <option>Category</option>
            </select>
          </div>
        </div>

        <!-- Description -->
        <div class="form-block">
          <textarea class="textarea" placeholder="Description"></textarea>
        </div>
      </div>

      <!-- Side area -->
      <aside class="listing-side">
        <!-- Item details -->
        <section class="form-block">
          <h2 class="section-title">Item Details</h2>

          <div>
            <div class="fake-select">
              <select class="select">
                <option>Condition</option>
              </select>
            </div>
          </div>

          <div>
            <input class="input" type="text" placeholder="Size">
          </div>

          <div>
            <input class="input" type="text" placeholder="Brand">
          </div>

          <div>
            <input class="input" type="text" placeholder="Model">
          </div>
        </section>

        <!-- Action buttons -->
        <div class="button-row">
<button id="postBtn" class="button-box dark">Post</button>
<div class="button-box outline">Cancel</div>
        </div>
      </aside>
    </section>
  </main>

  <div data-component="components/footer.html"></div>
    <script>
  const postBtn = document.getElementById("postBtn");
  postBtn.addEventListener("click", function () {
    postBtn.disabled = true;
    postBtn.textContent = "Posting...";
    setTimeout(() => {
      window.location.href = "product.html?posted=1";
    }, 1200);
  });
</script>
<script src="scripts/search.js"></script>
<script src="scripts/loadComponents.js"></script>
  </body>
</html>
