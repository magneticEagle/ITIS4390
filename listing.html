<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Makes the page scale correctly on phones -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Listing</title>
  <!-- Main stylesheet -->
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/listing.css">
  <link rel="stylesheet" href="css/dark-mode.css">
  <link rel="icon" type="image/png" href="favicon.png">

  <script>if(localStorage.getItem("marketplace_theme")==="dark")document.documentElement.classList.add("dark");</script>
</head>
<body>
  <!-- Top header -->
  <div data-component="components/header.html"></div>

  <!-- Main page content -->
  <main class="page-shell">
    <form id="listingForm" novalidate>
      <section class="main-card listing-page">
        <!-- Main form area -->
        <div class="listing-main">
          <!-- Image upload area -->
          <div class="form-block">
            <input
              type="file"
              id="listingImages"
              class="image-input"
              accept="image/*"
              multiple
            >

            <label for="listingImages" class="placeholder-box image-box image-upload-box">
              <div>
                <div>Select Images</div>
                <div class="small-text">(Max: 10)</div>
                <div class="upload-helper-text">Click here to choose photos from your computer</div>
              </div>
            </label>

            <small class="field-message" id="imageMessage"></small>
            <div class="image-preview-grid" id="imagePreviewGrid"></div>
          </div>

          <!-- Listing info -->
          <div class="form-block">
            <h1 class="section-title">Listing Information</h1>

            <div class="field-group">
              <input
                class="input"
                type="text"
                id="title"
                placeholder="Title"
                maxlength="50"
              >
              <small class="field-message" id="titleMessage"></small>
            </div>

            <!-- Price and ZIP code -->
            <div class="two-col">
              <div class="field-group">
                <input
                  class="input"
                  type="text"
                  id="price"
                  placeholder="Price"
                  inputmode="decimal"
                >
                <small class="field-message" id="priceMessage"></small>
              </div>

              <div class="field-group">
                <input
                  class="input"
                  type="text"
                  id="zip"
                  placeholder="ZIP Code"
                  inputmode="numeric"
                  maxlength="5"
                >
                <small class="field-message" id="zipMessage"></small>
              </div>
            </div>
          </div>

          <!-- Category -->
          <div class="form-block">
            <div class="field-group">
              <div class="fake-select">
                <select class="select" id="category">
                  <option value="">Category</option>
                  <option value="furniture">Furniture</option>
                  <option value="electronics">Electronics</option>
                  <option value="clothing">Clothing</option>
                </select>
              </div>
              <small class="field-message" id="categoryMessage"></small>
            </div>
          </div>

          <!-- Description -->
          <div class="form-block">
            <textarea class="textarea" id="description" placeholder="Description (Optional)"></textarea>
          </div>
        </div>

        <!-- Side area -->
        <aside class="listing-side">
          <!-- Item details -->
          <section class="form-block">
            <h2 class="section-title">Item Details</h2>

            <div class="field-group">
              <div class="fake-select">
                <select class="select" id="condition">
                  <option value="">Condition</option>
                  <option value="new">New</option>
                  <option value="like-new">Like New</option>
                  <option value="used">Used</option>
                </select>
              </div>
              <small class="field-message" id="conditionMessage"></small>
            </div>

            <div class="field-group">
              <input class="input" type="text" id="size" placeholder="Size (Optional)">
            </div>

            <div class="field-group">
              <input class="input" type="text" id="brand" placeholder="Brand (Optional)">
            </div>

            <div class="field-group">
              <input class="input" type="text" id="model" placeholder="Model (Optional)">
            </div>
          </section>

          <!-- Action buttons -->
          <div class="button-row">
            <button id="postBtn" class="button-box dark" type="submit">Post</button>
            <button class="button-box outline" type="button">Cancel</button>
          </div>
        </aside>
      </section>
    </form>
  </main>

  <div data-component="components/footer.html"></div>
  <script src="scripts/search.js"></script>
  <script src="scripts/auth.js"></script>
  <script src="scripts/authModal.js"></script>
  <script src="scripts/darkMode.js"></script>
  <script src="scripts/inbox.js"></script>
  <script src="scripts/savedItems.js"></script>
  <script src="scripts/loadComponents.js"></script>
  <script src="scripts/listingValidation.js"></script>
</body>
</html>
