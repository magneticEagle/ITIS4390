<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Makes the page scale correctly on phones -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product</title>
  <!-- Main stylesheet -->
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/product.css">
  <link rel="stylesheet" href="css/dark-mode.css">
  <link rel="icon" type="image/png" href="favicon.png">

  <script>if(localStorage.getItem("marketplace_theme")==="dark")document.documentElement.classList.add("dark");</script>
</head>
<body>
  <!-- Top header -->
  <div data-component="components/header.html"></div>

  <div id="postBanner" class="post-banner">
  Your post is live!
  </div>

  <!-- Main page content -->
  <main class="page-shell">
    <section class="main-card product-page">
      <div class="product-main">
        <!-- Product image area -->
        <div class="product-image-wrap">
          <div class="placeholder-box image-box" id="productImagePlaceholder">Product Image Carousel</div>

          <!-- Carousel dots -->
          <div class="carousel-dots" id="productImageThumbs" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>

        <!-- Product heading -->
        <section class="product-header">
          <div class="product-heading-row">
            <div class="product-heading-text">
              <h1 class="section-title" id="productTitle">Listing Name</h1>
              <p class="muted-text" id="productLocationText">City, State</p>
              <p class="small-text" id="productListedText">Listed (time) ago</p>
            </div>

            <p class="product-price" id="productPrice">$000.00</p>
          </div>
        </section>

        <!-- Main actions -->
        <div class="button-row product-buttons">
<button class="button-box dark offer-btn" type="button" id="offerBtn">Offer</button>
<button class="button-box outline wishlist-btn" type="button" aria-pressed="false"> <!-- Added 4/8/2026 -->
    Save
  </button>
        </div>

        <!-- Product details -->
        <section class="info-block product-details-block">
          <h2 class="section-title">Product Details</h2>
          <ul class="details-list" id="productDetailsList">
            <li>Category: x</li>
            <li>Brand: y</li>
            <li>Model: z</li>
          </ul>
        </section>

        <!-- Description -->
        <section class="info-block product-description">
          <h2 class="section-title">Description</h2>
          <p class="muted-text" id="productDescriptionText">Text body</p>
        </section>

        <!-- Seller info -->
        <section class="info-block seller-block">
          <h2 class="section-title">Seller</h2>

          <div class="seller-row">
            <div class="seller-avatar"></div>
            <div>
              <p class="muted-text">Seller Name</p>
              <p class="small-text">X reviews, X/X Stars</p>
            </div>
          </div>
        </section>

        <!-- Location -->
        <section class="info-block product-location">
          <h2 class="section-title">Location</h2>
          <div class="placeholder-box" id="productMapPlaceholder">Map of Product Location</div>
        </section>
      </div>
    </section>
  </main>

  <div data-component="components/footer.html"></div>
    <script src="scripts/savedItems.js"></script>
    <script src="scripts/products.js"></script>
    <!-- UPDATED: 4/7/2026 -->
    <script src="scripts/productInteractions.js"></script>
  <script>
  const params = new URLSearchParams(window.location.search);
  if (params.get("posted") === "1") {
    const banner = document.getElementById("postBanner");
    banner.classList.add("show");
    setTimeout(() => {
      banner.classList.remove("show");
    }, 3000);
  }
</script>
    <script src="scripts/search.js"></script>
    <script src="scripts/auth.js"></script>
  <script src="scripts/authModal.js"></script>
  <script src="scripts/darkMode.js"></script>
  <script src="scripts/inbox.js"></script>
  <script src="scripts/loadComponents.js"></script>
</body>
</html>
