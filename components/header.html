<!-- header -->
<header class="site-header">
  <div class="page-shell">
    <div class="header-row">
      <a class="logo" href="index.html" aria-label="Home">
        <img src="images/eMarketLogo.png" alt="" width="36" height="36">
      </a>

      <!-- Search bar -->
      <div class="search-wrap">
        <input type="text" id="search-input" placeholder="Search" aria-label="Product search">
        <ul id="search-results" class="search-results hidden"></ul>

        <!-- Full page loading overlay -->
        <div id="loading-overlay" class="loading-overlay hidden">
          <div class="spinner"></div>
          <p>Searching...</p>
        </div>
      </div>

      <!-- message inbox and account -->
      <div class="inbox-wrap">
        <button
          class="header-box icon-btn inbox-trigger"
          type="button"
          aria-label="Inbox"
          aria-expanded="false"
          aria-controls="inbox-panel"
        >
          <span class="inbox-icon">✉</span>
          <span class="inbox-badge hidden" id="inboxBadge"></span>
        </button>

        <div class="inbox-panel hidden" id="inbox-panel" role="dialog" aria-label="Inbox">
          <div class="inbox-panel-header">
            <span class="inbox-panel-title">Inbox</span>
          </div>
          <ul class="inbox-list" id="inboxList">
            <li class="inbox-empty">No messages yet</li>
          </ul>
        </div>
      </div>

      <button
        class="header-box icon-btn account-menu-trigger"
        type="button"
        aria-label="Open account menu"
        aria-expanded="false"
        aria-controls="account-menu-panel"
      >
        <span>𖨆</span>
      </button>

      <!-- mobile hamburger menu -->
      <details class="mobile-nav">
        <summary class="menu-toggle" aria-label="Open menu">
          <span></span>
          <span></span>
          <span></span>
        </summary>

        <div class="mobile-menu">
          <nav aria-label="Mobile navigation">
            <a href="index.html">Home</a>
            <a href="search.html">Search</a>
            <a href="listing.html">Post</a>
            <a href="help.html">Help</a>
          </nav>
        </div>
      </details>

      <!-- desktop nav -->
      <nav class="desktop-nav" aria-label="Desktop navigation">
        <a href="index.html">Home</a>
        <a href="search.html">Search</a>
        <a href="listing.html">Post</a>
        <a href="help.html">Help</a>
      </nav>
    </div>
  </div>
</header>

<!-- Account menu overlay + panel -->
<div class="account-menu-overlay hidden" id="account-menu-overlay" aria-hidden="true">
  <div
    class="account-menu-panel"
    id="account-menu-panel"
    role="dialog"
    aria-modal="true"
    aria-labelledby="account-menu-title"
  >
    <div class="account-menu-content">
      <div class="account-menu-header">
        <div>
          <p class="account-menu-eyebrow">Account</p>
          <h2 id="account-menu-title">Your Menu</h2>
        </div>

        <button class="account-menu-close" type="button" aria-label="Close account menu">✕</button>
      </div>

      <div class="account-menu-actions">
        <button class="account-menu-action" type="button">Profile</button>
        <button class="account-menu-action" type="button">Saved Items</button>
        <button class="account-menu-action" type="button">Dark Mode / Light Mode</button>
        <button class="account-menu-action" id="menu-signin-btn" type="button">Sign In / Create Account</button>
        <button class="account-menu-action logout" id="menu-logout-btn" type="button">Log Out</button>
      </div>
    </div>
  </div>
</div>

<!-- Page transition spinner -->
<div id="page-spinner" class="page-spinner hidden">
  <div class="spinner"></div>
</div>
