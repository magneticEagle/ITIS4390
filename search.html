<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/search.css" />
</head>

<body>
<div data-component="components/header.html"></div>
  <main class="page-shell">
    <h1>Available Products</h1>
    <div class="filters">
      <div class="filter" data-filter-key="category">
        <button type="button" class="filter-btn">Category ▾</button>
        <div class="filter-dropdown">
          <p data-value="all">All categories</p>
          <p data-value="gaming">Gaming</p>
          <p data-value="furniture">Furniture</p>
          <p data-value="collectibles">Collectibles</p>
        </div>
      </div>

      <div class="filter" data-filter-key="recency">
        <button type="button" class="filter-btn">Recency ▾</button>
        <div class="filter-dropdown">
          <p data-value="all">Any time</p>
          <p data-value="24h">24 Hours</p>
          <p data-value="1w">1 Week</p>
          <p data-value="30d">30 Days</p>
          <p data-value="30plus">30+ Days</p>
        </div>
      </div>

      <div class="filter" data-filter-key="price">
        <button type="button" class="filter-btn">Price ▾</button>
        <div class="filter-dropdown">
          <p data-value="all">Default order</p>
          <p data-value="asc">Low to High</p>
          <p data-value="desc">High to Low</p>
          <p data-value="free">Free</p>
        </div>
      </div>

      <div class="filter" data-filter-key="condition">
        <button type="button" class="filter-btn">Condition ▾</button>
        <div class="filter-dropdown">
          <p data-value="all">Any condition</p>
          <p data-value="new">New</p>
          <p data-value="like-new">Like New</p>
          <p data-value="used-good">Used - Good</p>
          <p data-value="used-okay">Used - Okay</p>
        </div>
      </div>
    </div>
    <div class="product-grid" id="product-grid"></div>
  </main>
  <div data-component="components/footer.html"></div>
  <script src="scripts/loadComponents.js"></script>
  <script src="scripts/products.js"></script>
  <script src="scripts/search.js"></script>
</body>
</html>
