<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Help</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/help.css" />
</head>

<body>
  <div data-component="components/header.html"></div>

  <main class="help-page">
    <h1 class="help-page-title">Help and Support</h1>

    <div class="accordion-list">
      <div class="accordion-item">
        <span>Contact Information</span>
        <svg class="accordion-item-button" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9" />
        </svg>
      </div>

      <div class="accordion-item">
        <span>FAQ's</span>
        <svg class="accordion-item-button" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9" />
        </svg>
      </div>

      <div class="accordion-item">
        <span>Return Policy</span>
        <svg class="accordion-item-button" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9" />
        </svg>
      </div>

      <div class="accordion-item">
        <span>Billing and Payments</span>
        <svg class="accordion-item-button" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9" />
        </svg>
      </div>
    </div>
  </main>

  <div data-component="components/footer.html"></div>
  <script src="scripts/loadComponents.js"></script>
  <script src="scripts/search.js"></script>
</body>
</html>
